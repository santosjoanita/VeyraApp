<div class="modal-overlay" (click)="cancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h3>Add New Worker</h3>
      <button class="modal-close" (click)="cancel()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" [(ngModel)]="formData.name" class="form-input">
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="formData.email" class="form-input">
      </div>
      <div class="form-group">
        <label>Temporary Password *</label>
        <input type="password" [(ngModel)]="formData.password" class="form-input">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="formData.role" class="form-input">
          <option value="worker">Worker</option>
          <option value="admin">Admin</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="cancel()">Cancel</button>
      <button class="btn-save" (click)="submitForm()">Save Worker</button>
    </div>

  </div>
</div>
