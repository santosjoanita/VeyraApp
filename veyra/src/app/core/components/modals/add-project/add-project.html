<div class="modal-overlay" (click)="cancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h3>Add New Project</h3>
      <button class="modal-close" (click)="cancel()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label>Project Name *</label>
        <input type="text" [(ngModel)]="formData.name" class="form-input" required>
      </div>
      
      <div class="form-group">
        <label>Client *</label>
        <select [(ngModel)]="formData.clientId" class="form-input" required>
          <option value="" disabled selected>Select a client...</option>
          @for (client of clients; track client.id) {
            <option [value]="client.id">{{ client.name }}</option>
          }
        </select>
      </div>

      <div style="display: flex; gap: 12px;">
        <div class="form-group" style="flex: 1;">
          <label>Start Date *</label>
          <input type="date" [(ngModel)]="formData.startDate" class="form-input" required>
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Due Date *</label>
          <input type="date" [(ngModel)]="formData.endDate" class="form-input" required>
        </div>
      </div>

      <div class="form-group">
        <label>Status *</label>
        <select [(ngModel)]="formData.status" class="form-input" required>
          <option value="active">Active</option>
          <option value="paused">Paused</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="formData.description" class="form-input" style="min-height: 80px; resize: none;" ></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="cancel()">Cancel</button>
      <button class="btn-save" (click)="submitForm()">Save Project</button>
    </div>

  </div>
</div>
