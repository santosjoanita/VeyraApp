<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h3>Add Time Off</h3>
      <button class="modal-close" (click)="close.emit()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="info-banner" *ngIf="isAdmin">
      <span class="material-symbols-outlined info-icon">info</span>
      <p>Note: This time off will be registered under your account.</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="modal-body">
        
        <div class="form-row">
          <div class="form-group">
            <label>Start Date *</label>
            <input type="date" [(ngModel)]="vacationData.startDate" name="startDate" class="form-input" required>
          </div>
          <div class="form-group">
            <label>End Date *</label>
            <input type="date" [(ngModel)]="vacationData.endDate" name="endDate" class="form-input" required>
          </div>
        </div>

        <div class="form-group">
          <label>Notes</label>
          <textarea 
            [(ngModel)]="vacationData.note" 
            name="note" 
            class="form-input textarea-input" 
            placeholder="e.g. Summer Vacations, Family Trip..."
            rows="4">
          </textarea>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel btn-small" (click)="close.emit()">Cancel</button>
        <button type="submit" class="btn-save btn-small">Save Time Off</button>
      </div>
      
    </form>
  </div>
</div>
