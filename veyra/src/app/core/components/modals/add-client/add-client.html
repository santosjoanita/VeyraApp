<div class="modal-overlay" (click)="cancel()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h3>Add New Client</h3>
      <button class="modal-close" (click)="cancel()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" [(ngModel)]="formData.name" class="form-input">
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="formData.email" class="form-input">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="text" [(ngModel)]="formData.phone" class="form-input">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea [(ngModel)]="formData.notes" class="form-input" style="min-height: 80px; resize: none;"></textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" (click)="cancel()">Cancel</button>
      <button class="btn-save" (click)="submitForm()">Save Client</button>
    </div>

  </div>
</div>
