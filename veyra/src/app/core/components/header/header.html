<header class="header-container">
  
  <div class="header-left">
    <div class="search-wrapper">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search">
    </div>
  </div>

  <div class="header-right">
    
    @if (isAdmin) {
      <button class="icon-btn add-user-btn" title="Criar Novo Utilizador" (click)="isModalOpen = true">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
      </button>
    }

    <div class="user-info">
      <a routerLink="/profile" class="profile-link">
        <span class="user-name">{{ currentUser.name || 'Username' }}</span>
      </a>
      <span class="user-role">{{ currentUser.role }}</span>
    </div>
    
    <button class="icon-btn logout-btn" title="Sign Out" routerLink="/login" (click)="logout()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>

</header>

@if (isModalOpen) {
  <app-register-user (close)="isModalOpen = false"></app-register-user>
}
