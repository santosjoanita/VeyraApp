<div class="register-background">
  <div class="register-card">
    
    <div class="register-header">
      <h1>VEYRA</h1>
      <p>Infrastructure & Credential Management</p>
    </div>

<form class="register-form">      
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" [(ngModel)]="registerData.username">
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="text" id="email" name="email" [(ngModel)]="registerData.email">
      </div>

      <div class="input-group">
                <label for="username">Password</label>

        <div class="password-wrapper">
          <input [type]="showPassword() ? 'text' : 'password'" id="password" name="password" [(ngModel)]="registerData.password">
          
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="button" class="btn-register" (click)="onRegister()">Register</button>
      
    </form>
     <p class="login-redirect-text">
      Already have an account? Login <a routerLink="/login"><strong>here</strong></a>
    </p>
  </div>
</div>
