<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<div class="login-background">
  <div class="login-card">
    
    <div class="login-header">
      <h1>VEYRA</h1>
      <p>Infrastructure & Credential Management</p>
    </div>

    <form class="login-form">
      
      <div class="input-group">
        <input type="text" id="username" name="usernameOrEmail" [(ngModel)]="loginData.usernameOrEmail" placeholder="E-mail or username">
      </div>

      <div class="input-group">
        <div class="password-wrapper" style="position:relative;">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="loginData.password" name="password" placeholder="Password" style="padding-right:40px;">
          <span class="material-symbols-outlined" (click)="togglePassword()" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer;">
            {{ showPassword ? 'visibility_off' : 'visibility' }}
          </span>
        </div>
      </div>
      
      <button type="button" class="btn-login" (click)="onLogin()">Login</button>      
    </form>

    

  </div>
</div>
