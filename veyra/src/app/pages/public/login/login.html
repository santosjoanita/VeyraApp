<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<div class="login-background">
  <div class="login-card">
    
    <div class="login-header">
      <h1>VEYRA</h1>
      <p>Infrastructure & Credential Management</p>
    </div>

    <form class="login-form">
      
  <div class="input-group">
        <input type="text" id="username" placeholder="E-MAIL | USERNAME">
      </div>

      <div class="input-group">
      <label for="password">Password</label>
  
      <div class="password-wrapper">
        <input [type]="showPassword ? 'text' : 'password'" value="12345678" id="password" class="input">
    
        <span class="material-symbols-outlined eye-icon" (click)="togglePassword()">
      {{ showPassword ? 'visibility_off' : 'visibility' }}
        </span>
      </div>

</div>
    <a href="/dashboard" class="btn-login">Login</a>      
    </form>

    <p class="register-text">
      Don't have an account? Register <a href="/register"><strong> here</strong></a>
    </p>

  </div>
</div>
