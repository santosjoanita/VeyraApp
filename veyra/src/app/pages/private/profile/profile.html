<div class="profile-container">
  <app-sidebar></app-sidebar>

  <div class="main-content">
    
    <app-header></app-header>

    <div class="page-body">
        <h1>My Profile</h1>


        <div class="stats-grid">
    <div class="stat-card">
        <h1>Dexter Morgan</h1>
        <h3>Email:</h3>
        <h3>Profile: Admin</h3>
    </div>
    <div class="stat-card personal-info">
  <div class="stat-title">
    <h2>Personal Information</h2>
    <button class="btn-edit-stat">
      <span class="add-icon">✎</span> Edit
    </button>
  </div>

  <div class="info-fields-grid">
    
    <div class="form-group">
      <label>First Name</label>
      <input type="text" value="Dexter" class="profile-input">
    </div>

    <div class="form-group">
      <label>Last Name</label>
      <input type="text" value="Morgan" class="profile-input">
    </div>

    <div class="form-group">
      <label>Password</label>
      <div class="password-wrapper">
        <input [type]="showPassword ? 'text' : 'password'" value="12345678" class="profile-input">
        
        <span class="material-symbols-outlined eye-icon" (click)="togglePassword()">
          {{ showPassword ? 'visibility_off' : 'visibility' }}
        </span>
      </div>
      <a class="change-password-link">Change Password</a>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" value="morgan.dexter@branditdigitalmedia.com" class="profile-input">
    </div>

    <div class="form-group">
      <label>User Role</label>
      <div class="role-display">
        Admin
      </div>
    </div>

  </div>
</div>
    <div class="stat-card">
       <h1>Settings</h1>
    </div>
        </div>
    </div>
    </div>
</div>
