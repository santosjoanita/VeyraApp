<div class="profile-container">
  <app-sidebar></app-sidebar>

  <div class="main-content">
    <app-header></app-header>

    <div class="page-body">
      <h1>My Profile</h1>

      <div class="stats-grid">
        
        <div class="stat-card">
          <h1>{{ currentUser.firstName }} {{ currentUser.lastName }}</h1>
          <span class="stat-label"><strong>Email:</strong> {{ currentUser.email }}</span>
          <span class="stat-label-profile"><strong>Profile:</strong> {{ currentUser.role | titlecase }}</span>
        </div>
        
        <div class="stat-card personal-info">
          <div class="stat-title">
            <h2>Personal Information</h2>
            <button *ngIf="!isEditing" class="btn-edit-stat" (click)="startEditing()">
              <span class="add-icon">✎</span> Edit
            </button>
          </div>

          <div class="info-fields-grid">
            
            <div class="form-group">
              <label>First Name</label>
              <input type="text" [(ngModel)]="currentUser.firstName" name="firstName" class="profile-input" [disabled]="!isEditing">
            </div>

            <div class="form-group">
              <label>Last Name</label>
              <input type="text" [(ngModel)]="currentUser.lastName" name="lastName" class="profile-input" [disabled]="!isEditing">
            </div>

            <div class="form-group">
              <label>Password</label>
              <ng-container *ngIf="!isEditing; else passwordEdit">
                <div class="password-display">••••••••</div>
              </ng-container>
              <ng-template #passwordEdit>
                <div class="password-wrapper">
                  <input [type]="showPassword ? 'text' : 'password'"
                    [(ngModel)]="currentUser.password"
                    name="password"
                    class="profile-input"
                    placeholder="Enter a new password">
                  <button type="button" class="material-symbols-outlined password-toggle" (click)="togglePassword()">
                    {{ showPassword ? 'visibility_off' : 'visibility' }}
                  </button>
                </div>
              </ng-template>
            </div>

            <div class="form-group">
              <label>Email Address</label>
              <input type="email" [(ngModel)]="currentUser.email" name="email" class="profile-input" [disabled]="!isEditing">
            </div>

            <div class="form-group">
              <label>User Role</label>
              <div class="role-display">
                {{ currentUser.role | titlecase }}
              </div>
            </div>

          </div>

          <div *ngIf="isEditing" class="form-actions">
            <button class="btn-cancel" (click)="cancelEditing()">Cancel</button>
            <button class="btn-save" (click)="saveChanges()">Save Changes</button>
          </div>

        </div>
        
        <div class="stat-card">
          <h1>Settings</h1>
          
          <span class="stat-label">Enable Activity Log</span>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="settings.activityLog" name="activityLog">
            <span class="slider round"></span>
          </label>
          
          <span class="stat-label">Enable 2FA for my account.</span>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="settings.twoFactorAuth" name="twoFactorAuth">
            <span class="slider round"></span>
          </label>
          
          <span class="stat-label">Choose your Theme</span>
          <select class="dropdown" [(ngModel)]="settings.theme" name="theme">
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
        
      </div>
    </div>
  </div>
</div>
